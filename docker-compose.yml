# headless-3d-bench: controller + headless Blender (BlenderMCP).
#
#   python run.py build                                   # build with config.json versions
#   docker compose up -d blender                          # headless Blender + MCP on :8000
#   docker compose run --rm controller                    # controller test suite
#   docker compose run --rm controller python run.py run  # full benchmark run
#     (`run` starts blender too via depends_on; use --no-deps to skip)
#
# Secrets come from .env (git-ignored); see .env.example.
services:
  controller:
    image: headless-3d-bench
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.160.0}
        CODEX_MIRROR: ${CODEX_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        APT_MIRROR: ${APT_MIRROR:-}
    env_file:
      - path: .env
        required: false
    environment:
      - MCP_URL=${MCP_URL:-http://blender:8000/mcp}
    volumes:
      # agent workspaces + judge renders live under outputs/; the blender
      # container sees the same paths (/app/outputs), so no translation needed
      - ./outputs:/app/outputs
    depends_on:
      blender:
        condition: service_healthy

  blender:
    image: headless-3d-bench-blender
    build:
      context: .
      dockerfile: deps/blender/${BLENDER_VERSION:-5.2.2}/Dockerfile
      args:
        BLENDER_VERSION: ${BLENDER_VERSION:-5.2.2}
        BLENDERMCP_VERSION: ${BLENDERMCP_VERSION:-2.1.3}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        APT_MIRROR: ${APT_MIRROR:-}
    ports:
      # localhost only by default: the MCP endpoint is unauthenticated; open it up deliberately
      - "127.0.0.1:${BLENDER_MCP_PORT:-8000}:8000"
    volumes:
      - ./outputs:/app/outputs
    # Healthy once the MCP HTTP endpoint accepts TCP connections (the entrypoint
    # only starts it after Blender's socket server is up).
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    restart: unless-stopped
